<form
  #noteForm="ngForm"
  (ngSubmit)="onSubmit()"
  role="form"
  aria-labelledby="note-form-title"
>
  <h2 id="note-form-title">Create New Note</h2>
  <input
    name="title"
    [(ngModel)]="note.title"
    required
    #title="ngModel"
    placeholder="Title"
    aria-required="true"
    tabindex="0"
    class="input-field"
  />
  <div *ngIf="title.invalid && title.touched" class="error" role="alert">
    Title is required.
  </div>
  <textarea
    name="content"
    [(ngModel)]="note.content"
    required
    #content="ngModel"
    placeholder="Content"
    aria-required="true"
    tabindex="0"
    class="textarea-field"
  ></textarea>
  <div *ngIf="content.invalid && content.touched" class="error" role="alert">
    Content is required.
  </div>
  <button
    type="submit"
    [disabled]="noteForm.invalid"
    tabindex="0"
    aria-label="Save note"
  >
    Save
  </button>
</form>
