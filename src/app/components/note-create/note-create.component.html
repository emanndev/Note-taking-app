<div class="note-create-container">
  <div class="note-form">
    <!-- Note Title -->
    <div class="form-group title-group">
      <input
        type="text"
        placeholder="Enter a title..."
        class="title-input"
        maxlength="100"
      />
    </div>

    <!-- Note Metadata -->
    <div class="note-metadata">
      <!-- Tags Section -->
      <div class="metadata-row">
        <span class="metadata-icon">🏷️</span>
        <span class="metadata-label">Tags</span>
        <div class="metadata-value">
          <input
            type="text"
            placeholder="Add tags separated by commas (e.g. Work, Planning)"
            class="tags-input"
          />
          <div class="current-tags">
            <span class="tag">
              Dev
              <button type="button" class="remove-tag" aria-label="Remove tag">
                ×
              </button>
            </span>
            <span class="tag">
              Angular
              <button type="button" class="remove-tag" aria-label="Remove tag">
                ×
              </button>
            </span>
          </div>
        </div>
      </div>

      <!-- Last Edited Section -->
      <div class="metadata-row">
        <span class="metadata-icon">🕒</span>
        <span class="metadata-label">Last edited</span>
        <div class="metadata-value">
          <span class="last-edited">Not yet saved</span>
        </div>
      </div>
    </div>

    <!-- Note Content -->
    <div class="form-group content-group">
      <textarea
        placeholder="Start typing your note here..."
        class="content-textarea"
        rows="20"
      ></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="form-actions">
      <button type="button" class="btn btn-primary save-btn">Save Note</button>
      <button type="button" class="btn btn-secondary cancel-btn">Cancel</button>
    </div>
  </div>
</div>
