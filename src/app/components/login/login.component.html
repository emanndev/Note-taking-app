<div class="auth-container">
  <div class="auth-card">
    <img src="/assets/images/logo.svg" alt="Logo" class="logo" />
    <h2>Welcome to Note</h2>
    <p>Please log in to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        placeholder="email@example.com"
        formControlName="email"
      />
      <div
        class="error"
        *ngIf="
          loginForm.get('email')?.invalid && loginForm.get('email')?.touched
        "
      >
        <img
          src="/assets/images/icon-info.svg"
          alt="info-icon"
          class="info-icon red-icon"
        />
        Please enter a valid email address.
      </div>

      <div class="password-label-row">
        <label for="password">Password</label>
        <a class="forgot-link" routerLink="/forgot-password">Forgot?</a>
      </div>
      <div class="password-wrapper">
        <input
          id="password"
          type="password"
          placeholder="Password"
          formControlName="password"
        />
      </div>

      <!-- Remember Me Checkbox -->
      <div class="remember-row">
        <label class="checkbox-container">
          <input type="checkbox" formControlName="rememberMe" id="rememberMe" />
          <span class="checkmark"></span>
          <span class="label-text">Remember me</span>
        </label>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>
    <!-- loading spinner -->
    <div class="spinner" *ngIf="isLoading"></div>

    <div class="divider">Or log in with:</div>
    <button class="google-btn">
      <span class="g-icon"
        ><img src="/assets/images/icon-google.svg" alt="google-icon"
      /></span>
      Google
    </button>

    <p class="auth-footer">
      No account yet? <a routerLink="/signup">Sign Up</a>
    </p>
  </div>
</div>
