<div class="auth-container">
  <div class="auth-card">
    <img src="/assets/logo.svg" alt="Logo" class="logo" />
    <h2>Welcome to Note</h2>
    <p>Please log in to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label>Email Address</label>
      <input
        type="email"
        placeholder="email@example.com"
        formControlName="email"
      />

      <label>Password <a class="forgot-link">Forgot</a></label>
      <div class="password-wrapper">
        <input
          type="password"
          placeholder="Password"
          formControlName="password"
        />
      </div>

      <button type="submit">Login</button>
    </form>

    <div class="divider">Or log in with:</div>
    <button class="google-btn"><span class="g-icon">G</span> Google</button>

    <p class="auth-footer">
      No account yet? <a routerLink="/signup">Sign Up</a>
    </p>
  </div>
</div>
