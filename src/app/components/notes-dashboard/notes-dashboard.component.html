<div class="notes-dashboard">
  <div class="notes-panel" [class.mobile-hidden]="isMobile && selectedNoteId">
    <app-notes-list
      [selectedNoteId]="selectedNoteId"
      [currentSection]="currentSection"
      [selectedTag]="selectedTag"
      [filteredNotes]="filteredNotes"
      (noteSelect)="selectNote($event)"
      (createNote)="createNewNote()"
    ></app-notes-list>
  </div>

  <div class="content-panel" [class.mobile-full]="isMobile && selectedNoteId">
    <!-- Mobile Back Button -->
    <div class="mobile-header" *ngIf="isMobile && selectedNoteId">
      <button class="back-btn" (click)="goBack()">
        <span class="back-icon">‹</span>
        Back to Notes
      </button>
    </div>

    <div class="note-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
