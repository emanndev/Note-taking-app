<div class="notes-dashboard">
  <!-- This will display the note details component based on routing -->
  <router-outlet></router-outlet>

  <!-- Empty State when no notes exist -->
  <div class="empty-state" *ngIf="noteService.getNotes().length === 0">
    <div class="empty-state-content">
      <div class="empty-icon">📝</div>
      <h2>No notes yet</h2>
      <p>Create your first note to get started</p>
      <button class="create-first-note-btn" (click)="createNewNote()">
        Create Your First Note
      </button>
    </div>
  </div>
</div>
