<div class="app-container">
  <!-- Sidebar -->
  <nav class="sidebar" [class.collapsed]="sidebarCollapsed">
    <!-- Header -->
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">📝</span>
        <span class="logo-text" *ngIf="!sidebarCollapsed">Notes</span>
      </div>
    </div>

    <!-- All Notes Section -->
    <div class="sidebar-section">
      <button
        class="section-button"
        [class.active]="currentSection === 'all'"
        (click)="setCurrentSection('all')"
        routerLink="/dashboard/notes"
      >
        <span class="section-icon">📄</span>
        <span class="section-text" *ngIf="!sidebarCollapsed">All Notes</span>
        <span class="expand-icon" *ngIf="!sidebarCollapsed">›</span>
      </button>
    </div>

    <!-- Create New Note Button -->
    <button
      class="create-note-btn"
      routerLink="/dashboard/create"
      *ngIf="!sidebarCollapsed"
    >
      + Create New Note
    </button>

    <!-- Notes List -->
    <div class="notes-list" *ngIf="!sidebarCollapsed">
      <div
        *ngFor="let note of getVisibleNotes()"
        class="note-item"
        [class.active]="selectedNoteId === note.id"
        (click)="selectNote(note.id)"
      >
        <h4 class="note-title">{{ note.title }}</h4>
        <div class="note-meta">
          <span class="note-tags">
            <span *ngFor="let tag of note.tags; let last = last" class="tag">
              {{ tag }}<span *ngIf="!last">, </span>
            </span>
          </span>
          <span class="note-date">{{ formatDate(note.lastEdited) }}</span>
        </div>
      </div>
    </div>

    <!-- Archived Notes -->
    <div class="sidebar-section" *ngIf="!sidebarCollapsed">
      <button
        class="section-button archived-section"
        [class.active]="currentSection === 'archived'"
        (click)="setCurrentSection('archived')"
        routerLink="/dashboard/archived"
      >
        <span class="section-icon">📁</span>
        <span class="section-text">Archived Notes</span>
      </button>
    </div>

    <!-- Tags Section -->
    <div class="tags-section" *ngIf="!sidebarCollapsed">
      <h3 class="tags-title">Tags</h3>
      <div class="tag-list">
        <button
          *ngFor="let tag of getAllTags()"
          class="tag-filter"
          [class.active]="selectedTag === tag"
          (click)="filterByTag(tag)"
        >
          {{ tag }}
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="main-header">
      <button class="sidebar-toggle" (click)="toggleSidebar()">☰</button>

      <div class="header-content">
        <h1 class="page-title">{{ getPageTitle() }}</h1>
        <div class="search-container">
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (input)="onSearch()"
            placeholder="Search by title, content, or tags..."
            class="search-input"
          />
          <span class="search-icon">🔍</span>
        </div>
        <button class="settings-btn" routerLink="/dashboard/settings">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Content Area -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
