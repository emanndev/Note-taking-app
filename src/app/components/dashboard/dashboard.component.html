<div class="app-container">
  <!-- Sidebar -->
  <app-sidebar
    [isCollapsed]="sidebarCollapsed"
    [selectedNoteId]="selectedNoteId"
    [currentSection]="currentSection"
    [selectedTag]="selectedTag"
    [isMobileHidden]="isMobile && !showMobileSidebar"
    [showMobileClose]="isMobile"
    (sectionChange)="setCurrentSection($event)"
    (noteSelect)="selectNote($event)"
    (tagFilter)="filterByTag($event)"
    (createNote)="createNewNote()"
    (closeMobileSidebar)="closeMobileSidebar()"
  ></app-sidebar>

  <!-- Main Content -->
  <main class="main-content" [class.sidebar-collapsed]="sidebarCollapsed">
    <!-- Header -->
    <header class="main-header">
      <div class="header-left">
        <button class="sidebar-toggle" (click)="toggleSidebar()">
          <span class="hamburger-icon">☰</span>
        </button>
        <h1 class="page-title">{{ getPageTitle() }}</h1>
      </div>

      <div class="header-right">
        <div class="search-container">
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (input)="onSearch()"
            placeholder="Search by title, content, or tags..."
            class="search-input"
          />
          <span class="search-icon">🔍</span>
        </div>
        <button class="settings-btn" (click)="openSettings()">⚙️</button>
      </div>
    </header>

    <!-- Content Area -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Mobile Sidebar Overlay -->
  <div
    class="mobile-overlay"
    *ngIf="isMobile && showMobileSidebar"
    (click)="closeMobileSidebar()"
  ></div>
</div>
