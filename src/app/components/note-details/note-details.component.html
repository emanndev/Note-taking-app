<form
  #noteForm="ngForm"
  (ngSubmit)="onSave()"
  role="form"
  aria-labelledby="note-details-title"
>
  <h2 id="note-details-title">Edit Note</h2>
  <input
    name="title"
    [(ngModel)]="note.title"
    required
    #title="ngModel"
    placeholder="Title"
    aria-required="true"
    tabindex="0"
    class="input-field"
  />
  <div *ngIf="title.invalid && title.touched" class="error" role="alert">
    Title is required.
  </div>
  <textarea
    name="content"
    [(ngModel)]="note.content"
    required
    #content="ngModel"
    placeholder="Content"
    aria-required="true"
    tabindex="0"
    class="textarea-field"
  ></textarea>
  <div *ngIf="content.invalid && content.touched" class="error" role="alert">
    Content is required.
  </div>
  <div class="actions">
    <button
      type="submit"
      [disabled]="noteForm.invalid"
      tabindex="0"
      aria-label="Save changes"
    >
      Save
    </button>
    <button
      type="button"
      (click)="onDelete()"
      (keyup.enter)="onDelete()"
      tabindex="0"
      aria-label="Delete note"
    >
      Delete
    </button>
  </div>
</form>
