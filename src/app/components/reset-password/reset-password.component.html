<div class="auth-container">
  <div class="auth-card">
    <img src="/assets/images/logo.svg" class="logo" alt="Logo" />
    <h2>Reset Password</h2>
    <p>Enter your new password below.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- New Password -->
      <label for="newPassword">New Password</label>
      <div class="password-wrapper">
        <input
          id="newPassword"
          [type]="showNewPassword ? 'text' : 'password'"
          placeholder="New Password"
          formControlName="newPassword"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="showNewPassword = !showNewPassword"
          aria-label="Toggle password visibility"
        >
          <img
            [src]="
              showNewPassword
                ? '/assets/images/icon-hide-password.svg'
                : '/assets/images/icon-show-password.svg'
            "
            alt="Toggle password visibility"
            class="toggle-password-icon"
          />
        </button>
      </div>
      <div
        class="error"
        *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
      >
        Password must be at least 8 characters.
      </div>

      <!-- Confirm Password -->
      <label for="confirmPassword">Confirm New Password</label>
      <div class="password-wrapper">
        <input
          id="confirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="Confirm Password"
          formControlName="confirmPassword"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="showConfirmPassword = !showConfirmPassword"
          aria-label="Toggle confirm password visibility"
        >
          <img
            [src]="
              showConfirmPassword
                ? '/assets/images/icon-hide-password.svg'
                : '/assets/images/icon-show-password.svg'
            "
            alt="Toggle password visibility"
            class="toggle-password-icon"
          />
        </button>
      </div>
      <div class="error" *ngIf="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched">
        Passwords do not match.
      </div>

      <!-- Feedback message -->
      <div *ngIf="message" [class]="isSuccess ? 'success-message' : 'error'">
        {{ message }}
      </div>

      <button type="submit" [disabled]="form.invalid || isLoading || !oobCode">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <p class="auth-footer">
      <a routerLink="/login">Back to Login</a>
    </p>
  </div>
</div>
